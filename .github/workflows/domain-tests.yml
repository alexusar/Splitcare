name: SplitCare domain checks
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/domain-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/domain-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test payment and wheel rules
        run: node --test tests/*.test.mjs
