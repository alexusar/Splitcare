<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Matters · Page Mockups</title><style>
*{box-sizing:border-box}body{margin:0;background:#101322;color:#f0eaf9;font:14px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #dcc3ff;outline-offset:3px}.shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:218px 1fr;min-height:100vh}.side{background:#17192a;border-right:1px solid #353047;padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;margin:0 0 35px 7px}.brand span{color:#cba5f3}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaaac1;text-align:left;padding:13px 14px;border-radius:11px}.nav button.active{background:#423153;color:#f6eaff}.nav button:hover{background:#342a46;color:white}.hint{font-size:11px;line-height:1.6;color:#9b91a9;padding:24px 10px}.main{padding:36px;min-width:0}.eyebrow{color:#c4a6ed;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.heading h1{font-size:31px;margin:6px 0}.subtitle{color:#aaaac0;margin:2px 0 0}.button{background:#d5b5f8;color:#1e152c;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.ghost{background:#29253b;border:1px solid #504260;color:#e2c6ff;padding:11px 14px;border-radius:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.card{background:linear-gradient(140deg,#232439,#201e31);border:1px solid #37324c;border-radius:17px;padding:20px;min-width:0}.card h3{margin:0 0 12px;font-size:17px}.metric{font-size:27px;font-weight:800;margin:15px 0 5px}.muted{color:#a9a3bd;font-size:12px;line-height:1.6}.pill{display:inline-block;border-radius:7px;padding:5px 8px;font-size:11px;background:#4b3a5f;color:#dac0f5;font-weight:700}.pill.ok{background:#214c42;color:#90dfc1}.pill.warn{background:#604423;color:#f1c786}.list{display:grid;gap:0}.line{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ffffff12}.line:last-child{border:0}.person{display:flex;align-items:center;gap:10px}.avatar{background:#a879d543;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;color:#f2d8ff;font-weight:700;flex-shrink:0}.amount{font-weight:750;white-space:nowrap}.thumb{height:145px;border-radius:12px;background:radial-gradient(circle at 70% 10%,#9070a3,transparent 50%),linear-gradient(150deg,#235369,#654c7f 55%,#231e3b);display:grid;place-items:center;font-size:55px}.bar{height:7px;border-radius:5px;background:#534763;overflow:hidden;margin:12px 0}.bar div{height:100%;background:#c7a0f0}.label{font-size:12px;color:#a8a1b6}.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{padding:7px 10px;border-radius:8px;border:1px solid #554467;font-size:11px;color:#ddd0ec}.wheel{width:220px;height:220px;border-radius:50%;border:9px solid #d1b4e9;background:conic-gradient(#ac8fd2 0 36deg,#d2a469 36deg 72deg,#ad91d6 72deg 108deg,#76ab93 108deg 144deg,#ac8fd2 144deg 180deg,#cc829b 180deg 216deg,#a78acf 216deg 252deg,#d5a16f 252deg 288deg,#ab89d0 288deg 360deg);margin:15px auto;position:relative}.wheel:after{content:"SPIN";position:absolute;top:calc(50% - 25px);left:calc(50% - 25px);width:50px;height:50px;display:grid;place-items:center;background:#27243b;border-radius:50%;border:3px solid #e2cef1;font-size:12px;font-weight:800}.table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}.table th{color:#a9a3be;font-size:11px;font-weight:500}.table td,.table th{border-bottom:1px solid #ffffff12;padding:13px 8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:56px;background:#302d42;border-radius:8px;padding:8px;font-size:12px}.day.free{background:#224d47}.day.maybe{background:#61502e}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#bcd9c5;margin:4px 1px}.hidden{display:none!important}.alert{border:1px dashed #9675b4;border-radius:12px;padding:10px 14px;color:#d2b6e3;font-size:12px;margin-bottom:23px}.mock{animation:fade .2s ease-out}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:sticky;height:auto;z-index:3;padding:14px;background:#17192af5}.brand{margin:0 0 10px;font-size:18px}.nav{display:flex;gap:5px;overflow-x:auto}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.hint{display:none}.main{padding:20px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span3,.span4{grid-column:span 2}.heading h1{font-size:25px}.heading .button{font-size:11px;padding:8px}.calendar .day{min-height:43px;padding:5px}.table{font-size:10px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">◇ family <span>matters.</span></div><nav class="nav" id="nav"></nav><p class="hint">Design preview only. These screens are visual mockups; buttons do not save data or represent deployed product features.</p></aside><main class="main"><div class="alert">DESIGN REVIEW • Concept mockups only • Not connected to family data or payments</div><div id="screen" class="mock"></div></main></div><script>
const nav=[["home","⌂ Home"],["expenses","▣ Expenses"],["applecare","♢ AppleCare"],["chores","✓ Chores"],["trips","✈ Trips & Calendar"],["admin","⚙ Family Admin"]];
const avatar=n=>'<span class="avatar">'+n[0]+'</span>',heading=(label,title,action)=>'<div class="heading"><div><div class="eyebrow">'+label+'</div><h1>'+title+'</h1><div class="subtitle">Your people. Your plans. One place.</div></div><button class="button">'+(action||"Preview")+'</button></div>',line=(name,caption,right)=>'<div class="line"><div class="person">'+avatar(name)+'<div><strong>'+name+'</strong><div class="muted">'+caption+'</div></div></div><div>'+right+'</div></div>',card=(title,body,span=1)=>'<div class="card '+(span>1?"span"+span:"")+'"><h3>'+title+'</h3>'+body+'</div>',pill=(name,status="")=>'<span class="pill '+status+'">'+name+'</span>';
const screens={
home:()=>heading("Dashboard","Welcome back, family 👋","Invite family")+'<div class="grid">'+card("AppleCare One",'<div class="metric">3 / 4 paid</div><div class="bar"><div style="width:75%"></div></div><div class="muted">One family member still pending</div>')+card("Chores this week",'<div class="metric">5 / 12</div><div class="bar"><div style="width:42%"></div></div><div class="muted">7 chores remaining</div>')+card("Next family trip",'<div class="metric">Iceland</div><div class="muted">May 2027 • Dates proposed</div>')+card("Family credits",'<div class="metric">$20.00</div><div class="muted">Across expense groups</div>')+card("Upcoming activity",line("Mom","Payment review requested",pill("Needs review","warn"))+line("Dana","Chore assigned: groceries",pill("To do"))+line("Caro","Voted for a trip weekend",pill("Voted")),2)+card("Trip spotlight",'<div class="thumb">🏔️</div><h3>Iceland — date planning</h3><div class="muted">4 people invited • 2 dates proposed</div>',2),
expenses:()=>heading("Money","Shared expenses","Add expense")+'<div class="chiprow"><span class="chip">All groups</span><span class="chip">Subscriptions</span><span class="chip">Bills</span><span class="chip">Travel</span></div><div class="grid">'+card("AppleCare One",'<div class="metric">$49.99</div><div class="muted">Monthly plan • 4 members</div>'+pill("3 of 4 confirmed","ok"))+card("Family streaming",'<div class="metric">$32.00</div>'+pill("All settled","ok"))+card("Household",'<div class="metric">Variable</div>'+pill("2 pending","warn"))+card("Trip savings",'<div class="metric">$1,200</div><div class="muted">Goal / illustration</div>')+card("Recent activity",line("Caro","AppleCare proof uploaded",pill("Review","warn"))+line("JLo","Split expense confirmed",pill("Confirmed","ok")),2)+card("Payment methods",'<div class="line"><strong>Zelle</strong>'+pill("Open banking app")+'</div><div class="line"><strong>Venmo</strong>'+pill("Open Venmo")+'</div><p class="muted">No bank credentials collected.</p>',2)+'</div>',
applecare:()=>heading("Expenses / AppleCare One","AppleCare split tracker","View history")+'<div class="grid">'+card("Spin to Pay",'<div class="wheel"></div><div class="muted">ONE spin per member per month • 10% free, 60% 1×, 20% 2×, 10% 3×. Server enforcement planned.</div>',2)+card("October · payment status",'<table class="table"><thead><tr><th>Member</th><th>Result</th><th>Due</th><th>Review</th></tr></thead><tbody><tr><td>Mom</td><td>1×</td><td>$10</td><td>'+pill("Verified","ok")+'</td></tr><tr><td>Dana</td><td>3×</td><td>$30</td><td>'+pill("Verified","ok")+'</td></tr><tr><td>JLo</td><td>1×</td><td>$10</td><td>'+pill("Pending","warn")+'</td></tr><tr><td>Caro</td><td>Free</td><td>$0</td><td>'+pill("Waived")+'</td></tr></tbody></table>',2)+card("Credit wallet",'<div class="metric">$20.00</div><div class="muted">Earned on confirmed extra payments, applied next month</div>',2)+card("Payment review",'<h3>Proof → OCR suggestion → Admin checks funds</h3><div class="muted">Never automatically approve transfers from screenshots.</div>',2)+'</div>',
chores:()=>heading("Household","Chores & responsibilities","Add chore")+'<div class="grid">'+card("This week",'<div class="metric">5 / 12 done</div><div class="bar"><div style="width:42%"></div></div><div class="muted">Recurring tasks reset on schedule</div>')+card("Your tasks",'<div class="metric">2 pending</div><div class="muted">Due this week</div>')+card("Completion rewards",'<div class="metric">125 points</div><div class="muted">Optional gamification</div>')+card("On-time streak",'<div class="metric">3 weeks</div><div class="muted">Illustrative statistic</div>')+card("Assignments",'<table class="table"><thead><tr><th>Chore</th><th>Owner</th><th>Repeats</th><th>Status</th></tr></thead><tbody><tr><td>Take out trash</td><td>Dana</td><td>Weekly</td><td>'+pill("Done","ok")+'</td></tr><tr><td>Kitchen cleanup</td><td>Mom</td><td>Daily</td><td>'+pill("Pending","warn")+'</td></tr><tr><td>Vacuum</td><td>Caro</td><td>Weekly</td><td>'+pill("Pending","warn")+'</td></tr><tr><td>Bathroom</td><td>JLo</td><td>Weekly</td><td>'+pill("Done","ok")+'</td></tr><tr><td>Laundry</td><td>Mom</td><td>Weekly</td><td>'+pill("Pending","warn")+'</td></tr></tbody></table>',4)+'</div>',
trips:()=>heading("Together","Trips & calendar","Suggest trip")+'<div class="grid">'+card("Proposed trips",'<div class="thumb">🌅</div>'+line("Iceland","May 2027 • 4 invited",pill("Planning"))+line("Spain","Summer 2027 • 3 interested",pill("Vote")),2)+card("Availability · November 2026",'<div class="calendar">'+Array.from({length:28},(_,i)=>'<div class="day '+([6,7,13,20,21].includes(i+1)?"free":i%5===0?"maybe":"")+'">'+(i+1)+'<br><i class="dot"></i><i class="dot"></i></div>').join("")+'</div><p class="muted">Mint = strong overlap; gold = mixed availability.</p>',2)+card("Best proposed dates",line("Nov 7–8","4 / 4 available",pill("Top match","ok"))+line("Nov 20–21","3 / 4 available",pill("Consider")),2)+card("Privacy rules",'<div class="muted">Members share available / busy / maybe, not personal event titles. Calendar sync requires explicit opt-in.</div>',2)+'</div>',
admin:()=>heading("Settings","Family administration","Invite member")+'<div class="grid">'+card("Members & roles",line("Alex","Admin",pill("Owner","ok"))+line("Mom","Member",pill("Active","ok"))+line("Dana","Member",pill("Active","ok"))+line("JLo","Member",pill("Active","ok"))+line("Caro","Member",pill("Active","ok")),2)+card("Invitation controls",'<h3>Private family links</h3><p class="muted">Expiring, single-use invitations bound to verified email. Each person sets a password.</p><button class="ghost">Generate invitation</button>',2)+card("Admin permissions",'<div class="line">Approve payments '+pill("Admin only")+'</div><div class="line">Reset wheel '+pill("Admin only")+'</div><div class="line">Configure expenses '+pill("Admin only")+'</div>',2)+card("Privacy & notifications",'<div class="line">Payment reminder opt-in '+pill("On")+'</div><div class="line">Share availability '+pill("Free/busy")+'</div><div class="line">Receipt storage '+pill("Private")+'</div>',2)+'</div>'
};
function show(name){const target=screens[name]?name:"home";document.querySelector("#nav").innerHTML=nav.map(([k,label])=>'<button data-target="'+k+'" class="'+(k===target?"active":"")+'">'+label+'</button>').join("");document.querySelector("#screen").innerHTML=screens[target]();history.replaceState(null,"","#"+target)}document.querySelector("#nav").addEventListener("click",e=>{let b=e.target.closest("button");if(b?.dataset.target)show(b.dataset.target)});addEventListener("hashchange",()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script></body></html>
